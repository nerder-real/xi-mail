name = "xi-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

# D1/KV/R2 不在此声明（注释掉）：由 Cloudflare Dashboard 在 Worker > Settings >
# Bindings 手动绑定（绑定名 db / kv；r2 可选，附件回退 KV）。与 cloud-mail 一致：
# wrangler 部署只管理配置中声明的绑定，未声明的绑定不会被覆盖/清空，因此
# Dashboard 手动绑定在每次部署后都能保留。
# 绑定名须与代码一致：env.db / env.kv / env.r2 / env.ai。

# Workers AI（验证码识别等功能，代码里 env.ai）。固定声明、无需资源 ID，每次部署保留。
[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 16 * * *"]

[vars]
orm_log = false

# 使用与上游一致的 pnpm 构建前端
[build]
command = "pnpm --prefix ../mail-view install && pnpm --prefix ../mail-view run build"
