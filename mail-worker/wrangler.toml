name = "xi-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

# 绑定声明（真实资源 ID 用 ${...} 占位符，不写死进公开仓库）：
# 需在 Cloudflare Builds 的 环境变量 中配置（Settings → Builds 或 Worker 变量）：
#   D1_DATABASE_ID   D1 数据库 ID（必需）
#   KV_NAMESPACE_ID  KV 命名空间 ID（必需）
# 也可在 Cloudflare Dashboard > Worker > Settings > Bindings 手动绑定同一资源。
# 每次 deploy 都以本配置显式带上这些绑定，因此不会丢失。
# r2 故意不声明（可选；附件自动回退到 KV 存储）。

[[d1_databases]]
binding = "db"
database_name = "xi-mail"
database_id = "${D1_DATABASE_ID}"

[[kv_namespaces]]
binding = "kv"
id = "${KV_NAMESPACE_ID}"

# Workers AI（验证码识别等功能，代码里 env.ai）。固定声明，每次部署保留。
[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 16 * * *"]

[vars]
orm_log = false

# 使用与上游一致的 pnpm 构建前端
[build]
command = "pnpm --prefix ../mail-view install && pnpm --prefix ../mail-view run build"
