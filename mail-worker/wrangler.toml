name = "xi-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

# D1/KV/R2 不声明（注释掉）：由 Cloudflare Dashboard 在 Worker > Settings > Bindings
# 手动绑定（绑定名 db / kv）。与 cloud-mail 保持一致：当 wrangler（4.90.0）部署时，
# 对于配置中未声明的绑定，旧版行为是保留远程现有绑定（不覆盖）。本测试用于验证
# “wrangler 版本”假设。绑定名须与代码一致：env.db / env.kv / env.r2 / env.ai。

#[[d1_databases]]
#binding = "db"
#database_name = "xi-mail"

#[[kv_namespaces]]
#binding = "kv"

# Workers AI（验证码识别等功能，代码里 env.ai）。固定声明、无需资源 ID，每次部署保留。
[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 16 * * *"]

[vars]
orm_log = false

# 使用与上游一致的 pnpm 构建前端
[build]
command = "pnpm --prefix ../mail-view install && pnpm --prefix ../mail-view run build"
