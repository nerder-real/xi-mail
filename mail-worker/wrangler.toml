name = "xi-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

# D1/KV/R2 不在配置中声明：由 Cloudflare Dashboard 在 Worker > Settings > Bindings
# 手动绑定（binding 名为 db / kv；r2 可选，附件回退 KV）。新版 wrangler v4 对配置
# 中未声明的绑定会在部署时保留，不会覆盖/清空 Dashboard 已有绑定。
# 绑定名须与代码一致：env.db / env.kv / env.r2 / env.ai。

# Workers AI（验证码识别等功能，代码里 env.ai）。固定声明、无需资源 ID，每次部署保留。
[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 16 * * *"]

[vars]
orm_log = false

# 使用与上游一致的 pnpm 构建前端
[build]
command = "pnpm --prefix ../mail-view install && pnpm --prefix ../mail-view run build"
