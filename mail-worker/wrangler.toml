name = "xi-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

# 重要：wrangler 部署以本文件为唯一配置源，会覆盖 Dashboard 上所有未在此声明的
# 绑定。因此 db/kv 必须在此声明，否则每次部署都会被清空。
# 真实资源 ID 不写死进公开仓库，用 \${...} 占位符，由 Cloudflare Builds 的
# 环境变量在部署时注入（wrangler 支持对 database_id / id 做环境变量插值）：
#   D1_DATABASE_ID   D1 数据库 ID（必需，否则 db 绑定丢失）
#   KV_NAMESPACE_ID  KV 命名空间 ID（必需，否则 kv 绑定丢失）

[[d1_databases]]
binding = "db"
database_name = "xi-mail"
database_id = "${D1_DATABASE_ID}"

[[kv_namespaces]]
binding = "kv"
id = "${KV_NAMESPACE_ID}"

# Workers AI（验证码识别等功能，代码里 env.ai）。固定声明、无需资源 ID。
[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 16 * * *"]

[vars]
orm_log = false

# 使用与上游一致的 pnpm 构建前端
[build]
command = "pnpm --prefix ../mail-view install && pnpm --prefix ../mail-view run build"
